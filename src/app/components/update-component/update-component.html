
@if (departamento) {
    <div style="border: 5px solid lightblue; margin: auto; width: 50%; display: flex; flex-direction: column; padding: 10px; margin-top: 20px;">
        <h1>UPDATE DEPARTAMENTO</h1>
        <form #formUpdate="ngForm" action="" style="display: flex; flex-direction: column; gap: 10px;">
            <label for="">Id Departamento: </label>
            <input name="cajaid" #cajaid type="number" value="{{departamento.numero}}" disabled>
            <label for="">Nombre: </label>
            <input name="cajanombre" #cajanombre value="{{departamento.nombre}}" type="text">
            <label for="">Localidad: </label>
            <input name="cajalocalidad" #cajalocalidad type="text" value="{{departamento.localidad}}">
            <button (click)="updateDept()" style="background-color: lightblue; border: 1px solid lightblue; border-radius: 8px;">update</button>
        </form>
    </div>
}
