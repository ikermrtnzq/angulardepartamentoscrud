<div style="display: flex; flex-direction: column; gap: 30px;margin:auto; width: 50%; padding-top: 40px;">
    <table>
        <thead style="background-color:lightblue;border: 3px solid lightblue;">
            <tr style="text-align: center;"> 
                <th style="padding-left: 5px;">Numero</th>
                <th style="padding-left: 5px;">Nombre</th>
                <th style="padding-left: 5px;">Localidad</th>
                <th style="padding-left: 15px;">Detalles</th>
                <th style="padding-left: 15px;">Modificar</th>
                <th style="padding-left: 15px;">Eliminar</th>
            </tr>
        </thead>
        <tbody>
            @for (departamento of departamentos; track departamento) {
                <tr style="border: 1px solid lightblue;">
                    <td style="border: 3px solid lightblue;padding-left: 5px;">{{departamento.numero}}</td>
                    <td style="border: 3px solid lightblue; padding-left: 5px;">{{departamento.nombre}}</td>
                    <td style="border: 3px solid lightblue;padding-left: 5px;">{{departamento.localidad}}</td>
                    <td style="border: 3px solid lightblue;padding-left: 5px;"><button style="border: 3px solid lightblue;border-radius: 5px; margin: 15px; background-color: lightblue;"><a [routerLink]="['/details/', departamento.numero, departamento.nombre, departamento.localidad]" style="text-decoration: none; color: black">detalle</a></button></td>
                    <td style="border: 3px solid lightblue;padding-left: 5px;"><button style="border: 3px solid lightblue;border-radius: 5px; margin: 15px; background-color: lightblue;"><a [routerLink]="['/update/', departamento.numero]" style="text-decoration: none; color: black">modificar</a></button></td>
                    <td style="border: 3px solid lightblue;padding-left: 5px;"><button (click)="eliminar(departamento.numero)" style="border: 3px solid lightblue;border-radius: 5px; margin: 15px; background-color: lightblue;">🗑️</button></td>
                </tr>
            }
        </tbody>
    </table>
</div>
